apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-worker
  template:
    metadata:
      labels:
        app: media-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: cloud-media-service:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "services/worker/index.mjs"]
          envFrom:
            - configMapRef: { name: media-config }
            - secretRef: { name: media-secrets }
          env:
            - { name: WORKER_CONCURRENCY, value: "1" }
            - { name: METRICS_PORT, value: "9091" }
            - name: WORKER_INSTANCE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
          ports:
            - { name: metrics, containerPort: 9091 }
          resources:
            requests: { cpu: 500m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
spec:
  selector:
    app: media-worker
  ports:
    - { name: metrics, port: 9091, targetPort: metrics }
