apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-api
  template:
    metadata:
      labels:
        app: media-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: cloud-media-service:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "services/api/index.mjs"]
          envFrom:
            - configMapRef: { name: media-config }
            - secretRef: { name: media-secrets }
          ports:
            - { name: http, containerPort: 4000 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: media-api
  ports:
    - { name: http, port: 4000, targetPort: http }
